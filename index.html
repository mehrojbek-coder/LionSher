<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040B18">
<meta name="description" content="Lion Sher Taxi — Yandex Go rasmiy hamkori. 0% park komissiyasi. Tarif tekshiruvchi va parkka ulanish.">
<meta property="og:title" content="Lion Sher Taxi">
<meta property="og:description" content="Yandex Go rasmiy hamkori · 0% park komissiyasi">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Lion Sher Taxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
html,body{margin:0}
.shell{padding-top:calc(18px + env(safe-area-inset-top,0px))}
:root{
  color-scheme: dark;
  --night:#040B18; --deep:#071228; --panel:rgba(18,32,64,.55); --panel-solid:#0C1934; --edge:rgba(140,170,255,.14);
  --royal:#5053F2; --royal-2:#7A7CFF; --azure:#38B6FF; --gold:#E9C987; --gold-2:#FFE7B3;
  --ok:#3DDC97; --no:#FF6B7A; --text:#EEF3FF; --muted:#8A98B8; --dim:#46557A;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--azure);outline-offset:3px}

/* ---------- stage lights ---------- */
.lights{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(80,83,242,.35),transparent 60%),linear-gradient(180deg,var(--deep),var(--night) 60%)}
.beam{position:absolute;top:-40px;width:260px;height:120vh;transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(210,225,255,.55),rgba(160,190,255,.10) 35%,transparent 70%);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(10px);opacity:.55;animation:sweep 9s ease-in-out infinite}
.beam::before{content:"";position:absolute;left:50%;top:34px;width:70px;height:10px;margin-left:-35px;border-radius:50%;background:#fff;box-shadow:0 0 30px 10px rgba(255,255,255,.8)}
.beam:nth-child(1){left:6%;animation-delay:-1s}.beam:nth-child(2){left:30%;animation-delay:-4s;animation-duration:11s}
.beam:nth-child(3){left:55%;animation-delay:-2.5s}.beam:nth-child(4){left:80%;animation-delay:-6s;animation-duration:10s}
@keyframes sweep{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
#dust{position:absolute;inset:0;width:100%;height:100%}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;max-width:520px;margin-inline:auto;min-height:100%;padding-inline:16px;padding-block:18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .emb{width:42px;height:42px}
.logo{border-radius:50%;background:#fff;object-fit:cover;padding:0}
.brand b{font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:15px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.demo{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(233,201,135,.4);padding:6px 9px;border-radius:999px;white-space:nowrap}
.page{display:flex;flex-direction:column;gap:14px;animation:pageIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.card{position:relative;border-radius:20px;background:linear-gradient(180deg,rgba(28,44,86,.62),rgba(12,22,46,.62));border:1px solid var(--edge);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:18px}
.h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ---------- hero ---------- */
.hero{text-align:center;padding:26px 18px 22px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:conic-gradient(from var(--r,0deg),transparent 0 70%,rgba(80,83,242,.55) 80%,rgba(56,182,255,.6) 88%,transparent 95%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px;animation:rim 6s linear infinite}
@property --r{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes rim{to{--r:360deg}}
.hero .emb{width:112px;height:112px;margin:0 auto 10px;display:block;filter:drop-shadow(0 12px 30px rgba(80,83,242,.6));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.wordmark{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,40px);letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#fff,#B9C4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:6px;color:var(--muted);font-size:14px}
.badge-y{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border-radius:999px;background:rgba(255,204,0,.1);border:1px solid rgba(255,204,0,.35);font-weight:700;font-size:13px;color:#FFD84D}
.badge-y i{width:8px;height:8px;border-radius:50%;background:#FFCC00;box-shadow:0 0 10px #FFCC00}
.stat-big{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:18px}
.stat-big b{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(233,201,135,.35))}
.zero-note{margin-top:8px;font-size:12.5px;color:#BFF5DC}
.stat-big span{text-align:left;font-size:13px;color:var(--muted);line-height:1.3;padding-bottom:6px}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.02em;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(135deg,var(--royal),#3A3CD0 60%,#2A8BE8);color:#fff;box-shadow:0 12px 30px -10px rgba(80,83,242,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.main::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:swipe 3s ease-in-out infinite}
@keyframes swipe{55%,100%{left:130%}}
.btn.alt{background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.btn.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#2b1e05;box-shadow:0 12px 30px -12px rgba(233,201,135,.9)}
.btn.block{width:100%}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feat{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--edge);text-align:left}
.feat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(80,83,242,.22);font-size:17px}
.feat b{font-size:13px;line-height:1.25}
.feat small{color:var(--muted);font-size:11.5px;line-height:1.35}

/* ---------- search ---------- */
.search{position:relative}
.search input{width:100%;padding:15px 16px 15px 44px;border-radius:14px;background:rgba(4,11,24,.7);border:1px solid var(--edge);outline:none;font-weight:600}
.search input:focus{border-color:var(--royal-2);box-shadow:0 0 0 4px rgba(80,83,242,.2)}
.search::before{content:"🔍";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:280px;overflow:auto;border-radius:14px;background:var(--panel-solid);border:1px solid var(--edge);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dd button{display:block;width:100%;text-align:left;padding:11px 14px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.04)}
.dd button:hover,.dd button.hl{background:rgba(80,83,242,.22)}
.dd .none{padding:12px 14px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--edge);font-size:12.5px;font-weight:600}
.chip.on{background:rgba(80,83,242,.3);border-color:var(--royal-2)}
.row2{display:grid;grid-template-columns:1fr 130px;gap:10px}
select,.inp{width:100%;padding:14px;border-radius:14px;background:rgba(4,11,24,.7);border:1px solid var(--edge);outline:none;font-weight:700;appearance:none}
.selw{position:relative}.selw::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* ---------- tariff ladder ---------- */
.car-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.car-head b{font-family:var(--display);font-size:20px;font-weight:800}
.best{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(233,201,135,.2),rgba(233,201,135,.04));border:1px solid rgba(233,201,135,.45)}
.best .crown{font-size:26px;filter:drop-shadow(0 0 10px rgba(233,201,135,.8))}
.best b{font-family:var(--display);font-size:20px;color:var(--gold-2)}
.best.bad{background:linear-gradient(135deg,rgba(255,107,122,.18),rgba(255,107,122,.04));border-color:rgba(255,107,122,.45)}
.best.bad b{color:#FFB3BB}
.ladder{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tier{position:relative;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(4,11,24,.5);border:1px solid var(--edge);
  opacity:0;transform:translateX(-14px);animation:tierIn .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes tierIn{to{opacity:1;transform:none}}
.tier .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.06)}
.tier b{display:block;font-weight:800;font-size:14.5px}
.tier small{color:var(--muted);font-size:12px}
.tier .st{font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.tier.ok{border-color:rgba(61,220,151,.35);background:linear-gradient(90deg,rgba(61,220,151,.12),rgba(4,11,24,.5))}
.tier.ok .ti{background:rgba(61,220,151,.18)}
.tier.ok .st{background:rgba(61,220,151,.16);color:var(--ok)}
.tier.near .st{background:rgba(233,201,135,.14);color:var(--gold)}
.tier.no .st{background:rgba(255,107,122,.12);color:var(--no)}
.tier.no > *{opacity:.5}
.tier.top{border-color:rgba(233,201,135,.6);box-shadow:0 0 0 1px rgba(233,201,135,.25),0 10px 30px -12px rgba(233,201,135,.6)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 10px;color:var(--muted)}
.empty .big{font-size:40px}

/* ---------- income ---------- */
.range{display:flex;flex-direction:column;gap:8px}
.range-top{display:flex;justify-content:space-between;align-items:baseline}
.range-top b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--royal) var(--p,50%),rgba(255,255,255,.1) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--royal);box-shadow:0 4px 14px rgba(80,83,242,.7)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:6px solid var(--royal)}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:6px;background:rgba(255,255,255,.06)}
.split i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.split .you{background:linear-gradient(90deg,var(--azure),var(--royal))}
.split .park{background:var(--gold)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{padding:14px;border-radius:16px;background:rgba(4,11,24,.5);border:1px solid var(--edge)}
.m small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.m b{display:block;font-family:var(--display);font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.m.big{grid-column:1/-1;background:linear-gradient(135deg,rgba(80,83,242,.35),rgba(56,182,255,.12));border-color:rgba(122,124,255,.5)}
.m.big b{font-size:32px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend .a::before{background:var(--azure)}.legend .b::before{background:var(--gold)}

/* ---------- form ---------- */
form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld .err{font-size:12px;color:var(--no);min-height:0}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.1);transition:background .4s}
.steps i.on{background:linear-gradient(90deg,var(--royal),var(--azure))}
.fit{font-size:13px;padding:10px 12px;border-radius:12px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3);color:#BFF5DC}
.fit.bad{background:rgba(255,107,122,.1);border-color:rgba(255,107,122,.3);color:#FFC6CC}
.success{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px}
.success .ring{width:96px;height:96px}
.success .ring circle{fill:none;stroke-width:6}
.success .ring .bg{stroke:rgba(255,255,255,.08)}
.success .ring .fg{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;animation:ring 1s .1s ease-out forwards}
.success .ring path{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:ring .5s .9s ease-out forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.sum{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;padding:14px;border-radius:14px;background:rgba(4,11,24,.5);border:1px solid var(--edge)}
.sum span{color:var(--muted)}

/* ---------- contacts ---------- */
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--edge);text-align:left;transition:transform .2s,border-color .2s}
.lnk:hover{transform:translateY(-2px);border-color:rgba(122,124,255,.5)}
.lnk .li{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.lnk .li svg{width:24px;height:24px;fill:#fff}
.lnk b{font-weight:800;font-size:15px;display:block}
.lnk small{color:var(--muted);font-size:12.5px}
.lnk .go{color:var(--muted);font-size:18px}
.tg{background:linear-gradient(135deg,#2AABEE,#1E88D8)}.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF)}
.bt{background:linear-gradient(135deg,var(--royal),#2A8BE8)}.ph{background:linear-gradient(135deg,#27C07D,#12925A)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:rgba(4,11,24,.6);border:1px solid var(--edge)}
.seg button{padding:11px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);transition:.25s}
.seg button.on{color:#fff;background:linear-gradient(135deg,var(--royal),#2A8BE8);box-shadow:0 8px 20px -8px rgba(80,83,242,.9)}
.msg{width:100%;text-align:left;white-space:pre-wrap;font-family:var(--body);font-size:13.5px;line-height:1.55;margin:0;padding:14px;border-radius:14px;background:rgba(4,11,24,.6);border:1px solid var(--edge);user-select:text}
a.btn,a.lnk{text-decoration:none;color:inherit}
.gd{background:linear-gradient(135deg,var(--gold-2),#C9A057)}.gd svg{fill:#2b1e05!important}
.home-links{display:flex;flex-direction:column;gap:10px}
.mini{padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);border:1px solid var(--edge);color:#fff;text-decoration:none;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)!important;font-size:14px!important}
.needs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.need{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(4,11,24,.5);border:1px solid var(--edge);opacity:0;transform:translateY(8px);animation:tierIn .45s cubic-bezier(.2,.8,.2,1) forwards}
.need .ni{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:rgba(80,83,242,.2)}
.need b{display:block;font-weight:800;font-size:14.5px}.need small{color:var(--muted);font-size:12.5px}
.need .ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ok);background:rgba(61,220,151,.14)}
.cta-card{display:flex;align-items:center;gap:14px}.cta-card b{display:block;font-family:var(--display);font-size:17px}.cta-card small{color:var(--muted);font-size:13px}
.big-cta{padding:18px;font-size:15px;border-radius:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--edge)}
/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,rgba(4,11,24,.95) 35%)}
.tabs nav{width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:22px;background:rgba(12,25,52,.85);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:16px;font-size:10.5px;font-weight:700;color:var(--muted);transition:color .25s}
.tab .ic{font-size:19px;line-height:1;filter:grayscale(.6);transition:filter .25s,transform .25s}
.tab.on{color:#fff;background:linear-gradient(180deg,rgba(80,83,242,.5),rgba(80,83,242,.18))}
.tab.on .ic{filter:none;transform:translateY(-1px) scale(1.08)}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0E1E48,#040B18 65%);animation:splashOut .6s 2.1s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:12px}
.splash .emb{width:130px;height:130px;animation:drop 1s cubic-bezier(.2,1.3,.3,1) both;filter:drop-shadow(0 0 40px rgba(80,83,242,.8))}
@keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}}
.splash .wordmark{animation:up .8s .5s both}
.splash .tagline{animation:up .8s .8s both}
@keyframes up{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.flare{position:absolute;width:140vmax;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);top:40%;left:50%;transform:translateX(-50%) scaleX(0);animation:flare 1.1s .35s ease-out}
@keyframes flare{50%{transform:translateX(-50%) scaleX(1);opacity:1}100%{transform:translateX(-50%) scaleX(1);opacity:0}}

.toast{position:fixed;left:50%;bottom:100px;z-index:60;transform:translateX(-50%) translateY(20px);opacity:0;padding:11px 16px;border-radius:12px;background:#10204A;border:1px solid var(--edge);font-weight:700;font-size:13px;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

V.home.after = () => {
  const el = $("#comm");
  if (reduce) { el.textContent = "14,6"; return; }
  const t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / 1400), e = 1 - Math.pow(1 - k, 4);
    el.textContent = Math.round(100 * (1 - e)) + "%"; if (k < 1) requestAnimationFrame(f); })(t0);
};

V.tarif = () => `
  <section class="page">
    <div class="card">
      <p class="h2">Tarif tekshiruvchi</p>
      <p class="sub">Yandex Go Toshkent rasmiy talablari asosida.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">

          ${carSearch("q", S.model)}
          <div class="selw"><select id="yr" aria-label="Ishlab chiqarilgan yil">${yearOptions(S.year)}</select></div>
        </div>
        <div class="chips">${POPULAR.map(n => `<button class="chip${n === S.model ? " on" : ""}" data-pick="${esc(n)}">${esc(n.replace("Chevrolet ", ""))}</button>`).join("")}</div>
      </div>
    </div>
    <div class="card" id="result"></div>
    <p class="note" style="padding-inline:4px">Yil texpasport (TVG) bo'yicha hisoblanadi, mashina kamida 4 eshikli bo'lishi kerak. Yakuniy qarorni Yandex qabul qiladi. Premier uchun qo'shimcha talablar bor: qora yoki oq rang, charm salon, brendingsiz.</p>
  </section>`;
function renderResult() {
  const box = $("#result"); if (!box) return;
  if (!DATA[S.model]) { box.innerHTML = `<div class="empty"><div class="big">🔎</div>Modelni tanlang</div>`; return; }
  const rows = evaluate(S.model, S.year);
  const oks = rows.filter(r => r.state === "ok");
  const best = oks.sort((a, b) => RANK.indexOf(b.k) - RANK.indexOf(a.k))[0];
  box.innerHTML = `
    <div class="car-head"><div><div class="label">Mashina</div><b>${esc(S.model)}</b></div><div style="text-align:right"><div class="label">Yil</div><b>${S.year}</b></div></div>
    ${best ? `<div class="best"><span class="crown">👑</span><div><div class="label">Eng yuqori tarifingiz</div><b>${best.k}</b></div></div>`
           : `<div class="best bad"><span class="crown">⛔</span><div><div class="label">Natija</div><b>Hech bir tarifga mos emas</b></div></div>`}
    <div class="ladder">${rows.map((r, i) => `
      <div class="tier ${r.state}${best && r.k === best.k ? " top" : ""}" style="animation-delay:${i * 90}ms">
        <span class="ti">${r.ic}</span>
        <div><b>${r.k}</b><small>${esc(r.state === "no" ? r.d : r.text)}</small></div>
        <span class="st">${r.state === "ok" ? "✓ Mos" : r.state === "near" ? "Yil yetmaydi" : "Yo'q"}</span>
      </div>`).join("")}</div>
    <button class="btn main block" data-go="join" style="margin-top:14px">Shu mashina bilan ulanish</button>`;
}
V.tarif.after = () => {
  bindSearch("q", n => { S.model = n; document.querySelectorAll("[data-pick]").forEach(c => c.classList.toggle("on", c.dataset.pick === n)); renderResult(); });
  $("#yr").onchange = e => { S.year = +e.target.value; renderResult(); };
  renderResult();
};

/* ---------- router ---------- */
function go(tab) {
  S.tab = tab;
  document.querySelectorAll(".tab").forEach(b => { b.classList.toggle("on", b.dataset.t === tab); b.setAttribute("aria-current", b.dataset.t === tab ? "page" : "false"); });
  $("#view").innerHTML = V[tab]();
  V[tab].after && V[tab].after();
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.t); });
$("#view").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const q = e.target.closest("[data-quick]"); if (q) { S.model = q.dataset.quick; return go("tarif"); }
  const p = e.target.closest("[data-pick]"); if (p) { S.model = p.dataset.pick; $("#q").value = S.model;
    document.querySelectorAll("[data-pick]").forEach(c => c.classList.toggle("on", c === p)); return renderResult(); }
  const c = e.target.closest("[data-copy]"); if (c) return copyText(c.dataset.copy);
  const t = e.target.closest("a[data-tg]");
  if (t) { try { const tg = window.Telegram && window.Telegram.WebApp; if (tg && tg.openTelegramLink && tg.initData) { e.preventDefault(); tg.openTelegramLink(t.href); } } catch (err) {} }
});

/* ---------- dust ---------- */
(function dust() {
  const cv = $("#dust"), c = cv.getContext("2d"); let P = [], W, H, dpr;
  const fit = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    P = Array.from({ length: Math.round(innerWidth / 16) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.4 + .3) * dpr, v: (Math.random() * .2 + .05) * dpr, a: Math.random() * 6 })); };
  fit(); addEventListener("resize", fit);
  let t = 0;
  (function f() { t += .01; c.clearRect(0, 0, W, H);
    for (const p of P) { p.y -= p.v; if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      c.globalAlpha = .25 + .25 * Math.sin(t * 2 + p.a); c.fillStyle = "#BFD0FF"; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
    if (!reduce) requestAnimationFrame(f); })();
})();

go("home");
setTimeout(() => $("#splash").remove(), reduce ? 0 : 2800);
